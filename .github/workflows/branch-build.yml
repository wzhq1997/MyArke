# Manual build of the checked-out branch. No release publish, no signing: the packaged files
# are uploaded as an artifact and mirrored to the `builds` branch so they can be fetched over
# SSH. Dispatch with ref=oh-my-arke to build the 0.9.3 sources; stable takes its version from
# Cargo.toml and its notes from CHANGELOG.md. The file must live on the default branch
# (oh-my-arke) for workflow_dispatch to be available.
name: branch build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-x64
          workspaces: ". -> target/dist"
      # cargo xtask build regenerates THIRD_PARTY_LICENSES.md through cargo-about.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about
      # Produces arke-<version>-setup.exe as well; remove this step for exe-only builds.
      - uses: ./.github/actions/install-inno-setup
      - name: build
        shell: bash
        run: |
          cargo xtask build stable --arch x64
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arke-stable-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      # Mirror the packages into a standalone `builds` branch. The local script fetches this
      # branch over SSH, so no browser or artifact API download is needed on this machine.
      - name: publish to builds branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/builds"
          rm -rf "$work"
          mkdir -p "$work"
          cp -R dist/. "$work/"
          cd "$work"
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${{ github.ref_name }} ${{ github.sha }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -q --force origin HEAD:builds
          echo "published to builds:"
          ls -lh
